        <div class="fog f2"></div>
        <div class="fog f1"></div>
        <div class="dust"></div>
      </div>

    <div class="scroller">
    <header class="header-bar">
      <div class="loc">
        <button type="button" class="pill" id="loc-btn" aria-haspopup="listbox" aria-expanded="false">📍 <span id="loc-name">Lampang, Thailand</span> <span class="caret">▾</span></button>
        <div class="menu" id="loc-menu" role="listbox" hidden></div>
      </div>
      <span class="icon-btn" aria-label="Settings">⚙</span>
    </header>

    <div class="app-title">AIRSENSE IOT</div>

    <!-- เกจวงกลมแสดงค่า PM2.5 -->
    <section class="gauge">
      <svg viewBox="0 0 260 260">
        <circle id="track" cx="130" cy="130" r="100" fill="none"
                stroke="rgba(255,255,255,.22)" stroke-width="9" stroke-linecap="round"
                transform="rotate(135 130 130)" />
        <g id="ticks" stroke="rgba(255,255,255,.45)" stroke-width="1.5"></g>
        <circle id="arc" cx="130" cy="130" r="100" fill="none"
                stroke-width="9" stroke-linecap="round"
                transform="rotate(135 130 130)" />
        <text class="gauge-end" x="58" y="228">0</text>
        <text class="gauge-end" x="202" y="228">200</text>
      </svg>
      <div class="gauge-center">
        <div class="gauge-label">PM2.5</div>
        <div class="gauge-value" id="val">--</div>
        <div class="gauge-label">µg/m³</div>
      </div>
    </section>

    <div class="status" id="status">--</div>
    <div class="alert" id="alert"><span class="alert-ico">⚠</span><span id="tip"></span></div>

    <section class="card">
      <div class="stats">
        <div class="stat"><div class="gauge-label">PM2.5</div><div class="stat-value" id="pm2">--</div></div>
        <div class="stat"><div class="gauge-label">ความชื้น</div><div class="stat-value" id="hum">--</div></div>
      </div>
      <svg class="sparkline" id="spark" viewBox="0 0 300 56"></svg>
      <div class="device-info">
        <div class="info-cell"><span>อุปกรณ์</span><b id="devname">IoT-01</b></div>
        <div class="info-cell"><span>การเชื่อมต่อ</span><b><span class="dot" id="dot"></span><span id="conn">กำลังเชื่อมต่อ…</span></b></div>
        <div class="info-cell"><span>อัปเดตล่าสุด</span><b id="upd">--</b></div>
        <div class="info-cell"><span>ข้อมูลในฐานข้อมูล</span><b id="cnt">0</b></div>
      </div>
    </section>

    <section class="simulator">
      <div class="sim-top"><span>ตัวจำลองเซนเซอร์ · ส่งทุก 3 วิ</span><b id="sim-out">Auto</b></div>
      <input type="range" id="sim-range" min="0" max="200" step="1" value="40" aria-label="ค่า PM2.5 ที่จำลอง">
      <div class="simulator-buttons" id="btns"></div>
    </section>
    </div>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>

</html>
